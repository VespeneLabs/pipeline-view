name: Update visual snapshots

# Visual baselines must be generated on Linux (CI) so they match CI rendering.
# Run: gh workflow run update-snapshots.yml --ref <your-branch>
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter docs exec playwright install --with-deps chromium
      - run: pnpm --filter docs e2e --update-snapshots
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs/e2e
          git diff --cached --quiet || (git commit -m "test: update visual snapshots" && git push)
